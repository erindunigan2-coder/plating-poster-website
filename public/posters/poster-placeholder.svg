<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <rect width="900" height="1200" fill="#1A1F2E"/>
  <rect x="7" y="7" width="886" height="1186" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="900" height="1200" fill="url(#grid)"/>
  <!-- Logo area -->
  <rect x="350" y="480" width="200" height="120" rx="16" fill="rgba(30,36,53,0.8)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="388" y="500" width="124" height="52" rx="10" fill="url(#logoGrad)"/>
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A020"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
  </defs>
  <text x="450" y="535" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="28" fill="#1A1F2E" letter-spacing="1">PP</text>
  <text x="450" y="580" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="14" fill="rgba(240,237,232,0.6)" letter-spacing="2" text-transform="uppercase">PLATING POSTERS</text>
  <!-- "Shop Floor Edition" label -->
  <text x="450" y="650" text-anchor="middle" font-family="monospace" font-size="11" fill="#E8A020" letter-spacing="3">SHOP FLOOR EDITION</text>
  <!-- Corner marks -->
  <path d="M 15 27 L 15 15 L 27 15" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <path d="M 873 15 L 885 15 L 885 27" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <path d="M 15 1173 L 15 1185 L 27 1185" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <path d="M 885 1173 L 885 1185 L 873 1185" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>
